name: OpenDota Parse Queue
on:
  # Temporary manual trigger for immediate validation.
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * *'
      timezone: 'America/Sao_Paulo'
permissions:
  contents: read
  issues: write
concurrency:
  group: opendota-parse-queue
  cancel-in-progress: false
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ACCOUNT_ID: '186632203'
    steps:
      - name: Check and request parses
        shell: bash
        run: |
          set -euo pipefail
          readonly title='[state] OpenDota Parse Queue'
          readonly agent='Jhonatan-Dota-Coach/1.0'

          issue=$(gh issue list --state all --search '"[state] OpenDota Parse Queue" in:title' \
            --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -z "$issue" ]; then
            url=$(gh issue create --title "$title" \
              --body 'Registro automatico. REQUESTED/PARSED/FAILED/UNCERTAIN sao a fonte de verdade.')
            issue=${url##*/}
          else
            gh issue reopen "$issue" >/dev/null 2>&1 || true
          fi

          comments=$(gh api "repos/$GH_REPO/issues/$issue/comments?per_page=100" \
            --paginate --jq '.[].body')
          now() { date -u +%Y-%m-%dT%H:%M:%SZ; }
          comment() {
            gh issue comment "$issue" --body "$1" >/dev/null
            comments="$comments"$'\n'"$1"
            echo "$1"
          }
          latest_state() {
            grep -E "^(REQUESTED|PARSED|FAILED|UNCERTAIN) $1( |$)" <<<"$comments" \
              | tail -1 | awk '{print $1}' || true
          }
          latest_job() {
            grep -E "^REQUESTED $1( |$)" <<<"$comments" | tail -1 \
              | grep -Eo 'job=[^ ]+' | cut -d= -f2 || true
          }

          recent=$(curl -fsS --retry 2 --retry-all-errors --connect-timeout 10 \
            --max-time 30 -A "$agent" \
            "https://api.opendota.com/api/players/$ACCOUNT_ID/recentMatches") || {
              comment "FAILED RUN stage=recentMatches at=$(now)"; exit 1;
            }
          jq -e 'type == "array"' >/dev/null <<<"$recent" || {
            comment "FAILED RUN stage=recentMatches-json at=$(now)"; exit 1;
          }

          while read -r id; do
            [ -z "$id" ] && continue
            [ "$(latest_state "$id")" = PARSED ] && continue
            details=$(curl -fsS --connect-timeout 10 --max-time 30 -A "$agent" \
              "https://api.opendota.com/api/matches/$id" 2>/dev/null || true)
            if jq -e 'type == "object" and .match_id == ($id | tonumber) and .version != null' \
              >/dev/null 2>&1 <<<"$details"; then
              job=$(latest_job "$id")
              comment "PARSED $id job=${job:-unavailable} at=$(now)"
            fi
          done < <(grep '^REQUESTED ' <<<"$comments" | awk '{print $2}' \
            | sort -u | head -50 || true)

          attempts=0
          while read -r id; do
            [ -z "$id" ] && continue
            [ "$attempts" -ge 5 ] && break
            state=$(latest_state "$id")
            case "$state" in REQUESTED|PARSED|UNCERTAIN) continue ;; esac

            # The complete endpoint must explicitly report version == null.
            details=$(curl -fsS --connect-timeout 10 --max-time 30 -A "$agent" \
              "https://api.opendota.com/api/matches/$id" 2>/dev/null || true)
            jq -e 'type == "object" and .match_id == ($id | tonumber)' >/dev/null 2>&1 \
              <<<"$details" || {
                comment "FAILED $id stage=details at=$(now)"; continue;
              }
            if ! jq -e '.version == null' >/dev/null <<<"$details"; then
              comment "PARSED $id job=unavailable at=$(now)"; continue
            fi

            attempts=$((attempts + 1))
            # Persist first so a crash after POST can never cause a repeated POST.
            comment "UNCERTAIN $id stage=reserved-before-post job=unavailable at=$(now)"

            response=$(mktemp)
            set +e
            code=$(curl -sS --connect-timeout 10 --max-time 30 -A "$agent" \
              -o "$response" -w '%{http_code}' -X POST \
              "https://api.opendota.com/api/request/$id")
            rc=$?
            set -e
            body=$(tr '\n' ' ' <"$response" | cut -c1-300)
            rm -f "$response"

            if [ "$rc" -ne 0 ]; then
              comment "UNCERTAIN $id stage=post curl=$rc job=unavailable at=$(now)"
            elif [[ "$code" =~ ^2 ]]; then
              job=$(jq -r '.job.jobId // .jobId // empty' <<<"$body" 2>/dev/null || true)
              comment "REQUESTED $id job=${job:-unavailable} http=$code at=$(now)"
            else
              # Definite failure: latest state FAILED makes a later retry safe.
              comment "FAILED $id stage=post http=$code job=unavailable at=$(now) body=$body"
            fi
            sleep 2
          done < <(
            jq -r '.[] | select(.lobby_type == 7 and .version == null)
              | [.start_time, .match_id] | @tsv' <<<"$recent" \
              | sort -nr | cut -f2
          )
